              <button onClick={() => inviteJoin(invite, name)} className="btn-gold font-bold py-2.5 rounded-xl">🎉 Entrer dans le salon</button>
              <button onClick={() => { setInvite(null); setMsg(""); }} className="text-[11px] text-emerald-400 underline">Non merci, juste visiter</button>
              {msg && <p className="text-[11px] text-amber-200">{msg}</p>}
            </div>
          </div>
        )}
        <div className="flex gap-2 text-[11px] text-emerald-400 flex-wrap justify-center items-center pb-4">
          <span className="opacity-60 self-center">v2321-M</span>
        </div>
      </div>
    );
  }

  if (srv.state === "lobby") {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-5 p-6 text-emerald-100" style={bgStyle}>
        {STYLE}
        <h1 className="text-3xl text-amber-300" style={{ fontFamily: "Georgia, serif", textShadow: "0 3px 10px rgba(0,0,0,.6)" }}>{srv.code === "LOCAL" ? "Table locale" : "Salon"}</h1>
        {srv.code === "LOCAL" ? (
        <div className="panel rounded-2xl px-6 py-4 text-center" style={{ borderColor: "#38bdf866" }}>
          <div className="text-2xl">📡</div>
          <div className="text-sm text-sky-200 font-bold mt-1">Partie locale — sans internet</div>
          <div className="text-[11px] text-emerald-300 mt-1">Les joueurs proches voient ta table dans « Multijoueur local » et te rejoignent en un geste.</div>
          <div className="text-[10px] text-emerald-400 mt-1">bots {srv.options.level}</div>
        </div>
        ) : (
        <div className="panel rounded-2xl px-8 py-4 text-center">
          <div className="text-[10px] uppercase tracking-widest text-emerald-300">Code à partager</div>
          <div className="text-4xl font-bold text-amber-300 tracking-[.3em]" style={{ fontFamily: "Georgia, serif" }}>{srv.code}</div>
          <button onClick={() => {
            const url = window.location.origin + "/?salon=" + srv.code;
            const moi = (srv.players[youIdx] && srv.players[youIdx].name) || "Un ami";
            const texte = "🎴 " + moi + " t'invite à une partie de Ramy Gasy ! Touche le lien pour entrer directement dans le salon " + srv.code + " → " + url;
            if (navigator.share) {
              navigator.share({ title: "Ramy Gasy", text: texte, url }).catch(() => {
                if (navigator.clipboard) navigator.clipboard.writeText(texte).then(() => setMsg("Lien d'invitation copié — colle-le à tes amis !")).catch(() => setMsg(url));
                else setMsg(url);
              });
            } else if (navigator.clipboard) {
              navigator.clipboard.writeText(texte).then(() => setMsg("Lien d'invitation copié — colle-le à tes amis !")).catch(() => setMsg(url));
            } else setMsg(url);
          }} className="btn-gold font-bold py-2 px-6 rounded-xl text-sm mt-1">📤 Inviter des amis</button>
          <button onClick={() => {
            const doneMsg = "Code " + srv.code + " copié ✓ — colle-le où tu veux !";
            if (navigator.clipboard) navigator.clipboard.writeText(srv.code).then(() => setMsg(doneMsg)).catch(() => {
              window.prompt("Copie le code du salon :", srv.code);
            });
            else window.prompt("Copie le code du salon :", srv.code);
          }} className="btn-dark font-bold py-2 px-4 rounded-xl text-sm mt-1 ml-2">📋 Copier le code</button>
          <div className="text-[10px] text-emerald-400 mt-1">{srv.options.turnSeconds}s par tour · bots {srv.options.level} · {srv.options.pouvoirs === false ? "⚖️ sans pouvoirs 💎" : "💎 pouvoirs autorisés"}</div>
        </div>
        )}
        <div className="panel rounded-2xl p-4 w-full max-w-xs">
          {srv.players.map((p) => (
            <div key={p.idx} className="flex items-center gap-2 py-1.5 border-b border-emerald-800 last:border-0">
              <span className="text-lg">{p.avatar || "🙂"}{p.isBot ? <span className="text-[10px]"> 🤖</span> : null}</span>
              <span className="font-bold text-sm flex-1">{p.name}{p.idx === youIdx ? " (toi)" : ""}</span>
              {(p.wins || 0) > 0 && <span className="text-[10px] text-amber-300 font-bold">🏆{p.wins}</span>}
              {p.idx === 0 && <span className="text-[10px] text-amber-300 uppercase">hôte</span>}
              {isHost && p.idx !== 0 && (
                <button onClick={() => socket.emit("removePlayer", p.idx)}
                  className="btn-red rounded-lg px-2 py-0.5 text-xs font-bold" title={"Retirer " + p.name}>✕</button>
              )}
            </div>
          ))}
          {srv.players.length < 3 && <p className="text-[10px] text-emerald-400 mt-2">Minimum 3 joueurs pour lancer{isHost ? " — ajoute un bot si besoin" : ""}.</p>}
          <div className="border-t border-emerald-800 mt-2 pt-2">
            <span className="text-[10px] text-emerald-300">Ton emoji (les grisés sont pris) :</span>
            <div className="grid grid-cols-5 gap-1.5 justify-items-center mt-1">
              {AVATARS_POOL.map((a) => {
                const owner = srv.players.find((p) => p.avatar === a);
                const mine = me && me.avatar === a;
                const taken = owner && !mine && !owner.isBot; // les emojis des bots restent réclamables
                return (
                  <button key={a} disabled={taken}
                    onClick={() => { socket.emit("setAvatar", a); store.set("ramimp-avatar", a); }}
                    className={`text-lg rounded-xl p-1 transition-all ${mine ? "btn-gold scale-110" : taken ? "opacity-30" : "btn-dark"}`}>{a}</button>
                );
              })}
            </div>
          </div>
        </div>
        {isHost ? (
          <div className="flex gap-2">
            <button onClick={() => socket.emit("addBot")} disabled={srv.players.length >= 6} className="btn-dark font-bold py-2.5 px-4 rounded-xl text-sm disabled:opacity-40">+ Bot 🤖</button>
            <button onClick={() => { ensureAudio(); socket.emit("startGame"); }} disabled={srv.players.length < 3}
              className="btn-gold font-bold py-2.5 px-6 rounded-xl disabled:opacity-40">Lancer la partie</button>
          </div>
        ) : (
          <p className="text-sm text-emerald-300 animate-pulse">En attente du lancement par l'hôte…</p>
        )}
        <button onClick={quitRoom} className="btn-dark font-bold py-2 px-5 rounded-xl text-sm">🏠 Retour à l'accueil</button>
        {msg && <p className="text-xs text-amber-200">{msg}</p>}
      </div>
    );
  }

  if (srv.state === "over") {
    const ranking = [...srv.players].sort((a, b) => a.total - b.total);
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-5 p-6 text-emerald-100" style={bgStyle}>
        {STYLE}
        {ranking[0].idx === youIdx && <Confetti />}
        <h1 className="text-3xl text-amber-300" style={{ fontFamily: "Georgia, serif", textShadow: "0 3px 10px rgba(0,0,0,.6)" }}>Partie terminée</h1>
        <div className="panel rounded-2xl p-5 w-full max-w-xs">
          {ranking.map((p, i) => (
            <div key={p.idx} className={`flex justify-between py-2 border-b border-emerald-800 last:border-0 ${i === 0 ? "text-amber-300 font-bold" : ""}`}>
              <span>{i === 0 ? "👑 " : `${i + 1}. `}{p.avatar || "🙂"} {p.name}{p.isBot ? " 🤖" : ""}</span>
              <span>{p.total} pts{(p.wins || 0) > 0 ? " · 🏆" + p.wins : ""}</span>
            </div>
          ))}
        </div>
        {!nomVerrouille && (
          <button onClick={() => { setCptErr(""); setCptNouveau(null); setCptMode("choix"); setCptOpen(true); quitRoom(); }}
            className="panel rounded-2xl px-4 py-3 w-full max-w-xs text-left flex items-center gap-3" style={{ borderColor: "#f59e0b88" }}>
            <span className="text-2xl">👤</span>
            <span className="flex-1">
              <span className="block text-sm font-bold text-amber-300">{ranking[0].idx === youIdx ? "Belle victoire ! Garde-la précieusement" : "Ne perds pas ta progression"}</span>
              <span className="block text-[11px] text-emerald-300">Cette partie t'aurait rapporté <b className="text-yellow-300">+{10 + (ranking[0].idx === youIdx ? 25 : 0) + 10} 💎</b> avec un compte (partie, {ranking[0].idx === youIdx ? "victoire, " : ""}série du jour) — et 🎁 100 💎 offerts à l'inscription</span>
            </span>
            <span className="text-amber-300 font-bold">→</span>
          </button>
        )}
        <button onClick={() => partagerScore(ranking, false)} className="btn-dark font-bold py-2.5 px-6 rounded-xl text-sm">
          📤 Partager le score
        </button>
        {srv.rematch ? (
          <div className="panel rounded-2xl p-4 w-full max-w-xs text-center" style={{ borderColor: "#fbbf24" }}>
            <div className="text-sm font-bold text-amber-200 mb-1">🔁 Revanche proposée !</div>
            <div className="text-base mb-2">
              {srv.players.map((p) => (
                <span key={p.idx} className="mr-2 whitespace-nowrap">
                  {p.avatar}{srv.rematch.accepted.includes(p.idx) ? "✅" : srv.rematch.declined.includes(p.idx) ? "❌" : "⏳"}
                </span>
              ))}
            </div>
            {!srv.rematch.accepted.includes(youIdx) && !srv.rematch.declined.includes(youIdx) ? (
              <div className="flex gap-2 justify-center">
                <button onClick={() => socket.emit("rematchVote", true)} className="btn-green px-4 py-2 rounded-xl text-sm font-bold">✅ Je rejoue !</button>
                <button onClick={() => socket.emit("rematchVote", false)} className="btn-red px-4 py-2 rounded-xl text-sm font-bold">Non merci</button>
              </div>
            ) : (
              <p className="text-xs text-emerald-300 animate-pulse">En attente des autres joueurs… (30 s max)</p>
            )}
          </div>
        ) : actsAsHost ? (
          <button onClick={() => socket.emit("rematch")} className="btn-gold font-bold py-3 px-8 rounded-xl pulse-gold">🔁 Proposer une revanche</button>
        ) : (
          <p className="text-sm text-emerald-300 animate-pulse">L'hôte peut proposer une revanche — le compteur 🏆 continue…</p>
        )}
        <button onClick={quitRoom} className="btn-dark font-bold py-2 px-5 rounded-xl text-sm">🏠 Retour à l'accueil</button>
      </div>
    );
  }

  // ---------- Écran de jeu ----------
  const opponents = srv.players.filter((p) => p.idx !== youIdx);
  const topDiscard = g.discardTop;
  const lastLogs = (g.log || []).slice(-2);
  const needTri = contract.poseTout ? 0 : Math.max(0, contract.tri - stagedTri);
  const needEsc = contract.poseTout ? 0 : Math.max(0, contract.esc - stagedEsc);
  const buyOpen = g.phase === "buyWindow" && g.buyWindowUntil && passedWindow !== g.buyWindowUntil;
  const turnSec = secLeft(g.turnDeadline);

  return (
    <div className="fit-screen flex flex-col text-emerald-100" style={bgStyle}>
      {STYLE}
      {connLost && (
        <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-2xl shadow-xl animate-pulse">
          ⚠ Connexion perdue — reconnexion en cours…
        </div>
      )}
      {intro && (
        <div className="fixed inset-0 z-50 flex items-center justify-center pointer-events-none">
          <div className="panel rounded-3xl px-8 py-5 text-center" style={{ borderColor: "#fbbf24", animation: "introPop 2.2s ease forwards" }}>
            <div className="text-[11px] uppercase tracking-widest text-emerald-300">Manche {intro.num} / 8</div>
            <div className="text-3xl font-bold text-amber-300" style={{ fontFamily: "Georgia, serif" }}>{intro.label}</div>
          </div>
        </div>
      )}
      {g.roundOver && g.roundOver.winnerIdx === youIdx && <Confetti />}
      {emotes[youIdx] && (
        <div className="fixed bottom-44 left-3 z-40 bg-amber-100 text-emerald-950 text-sm font-bold px-3 py-1.5 rounded-2xl shadow-xl">
          Toi : {emotes[youIdx].text}
        </div>
      )}
      {/* Messages des autres joueurs, bien visibles au centre */}
      <div className="fixed top-24 left-1/2 -translate-x-1/2 z-40 flex flex-col gap-1 items-center pointer-events-none" style={{ maxWidth: "90vw" }}>
        {Object.values(emotes).filter((e) => e && e.idx !== youIdx).map((e) => (
          <div key={e.id} className="bg-amber-100 text-emerald-950 text-sm font-bold px-3 py-1.5 rounded-2xl shadow-xl">
            {(srv.players[e.idx] || {}).avatar || "🙂"} {(srv.players[e.idx] || {}).name} : {e.text}
          </div>
        ))}
      </div>
      {toast && (
        <div className="fixed top-14 left-1/2 -translate-x-1/2 z-40 flex items-center gap-2 panel rounded-2xl px-3 py-2" style={{ borderColor: "#fbbf24" }}>
          <Card card={toast.card} small flat />
          <span className="text-xs text-amber-100 font-bold leading-tight">
            {toast.name} {toast.kind === "buy" ? "achète" : "prend"} {cardName(toast.card)}<br />
            <span className="font-normal text-emerald-300">{toast.kind === "buy" ? "+1 carte de pénalité" : "dans la défausse"}</span>
          </span>
        </div>
      )}
      {drag && (
        <div style={{ position: "fixed", left: drag.x - 20, top: drag.y - (UI_PREFS.big ? 76 : 62), zIndex: 70, pointerEvents: "none", transform: "scale(1.15) rotate(3deg)", filter: "drop-shadow(0 12px 16px rgba(0,0,0,.55))" }}>
          <Card card={drag.card} flat />
        </div>
      )}
      {anims.map((a) => (
        <FlyingCard key={a.key} from={a.from} to={a.to} card={a.card} faceDown={a.faceDown} delay={0} emphasis={a.emphasis}
          onDone={() => setAnims((arr) => arr.filter((x) => x.key !== a.key))} />
      ))}

      {/* En-tête */}
      <div className="shrink-0 flex items-center justify-between px-3 py-2 border-b border-amber-500/20"
        style={{ background: "linear-gradient(180deg, rgba(4,35,24,.95), rgba(6,50,34,.85))" }}>
        <div className="flex items-center gap-2">
          <button onClick={() => setShowQuit(true)} className="btn-dark rounded-xl px-2.5 py-1.5 text-base leading-none">🏠</button>
          <div>
            <div className="text-amber-300 font-bold text-sm" style={{ fontFamily: "Georgia, serif" }}>Manche {g.mancheIdx + 1}/{g.nbManches || 8} · {srv.code}</div>
            <div className="text-[10px] text-emerald-400">{g.stockCount} en pioche · {srv.options.turnSeconds}s/tour{g.startedAt ? " · ⏱ " + fmtElapsed(g.startedAt) : ""}</div>
          </div>
        </div>
        <div className="flex items-center gap-1.5">
          <button onClick={() => { ensureAudio(); setMuted((m) => !m); }} className="btn-dark rounded-xl px-2 py-1.5 text-xs">{muted ? "🔇" : "🔊"}</button>
          <button onClick={() => setShowHelp(true)} className="btn-dark rounded-xl px-2.5 py-1.5 text-xs font-bold">?</button>
          <button onClick={() => setShowScores(true)} className="btn-dark rounded-xl px-2 py-1.5 text-[10px] font-bold">Scores</button>
          <button onClick={() => setShowLog(true)} className="btn-dark rounded-xl px-2 py-1.5 text-[10px] font-bold">Journal</button>
        </div>
      </div>

      {/* Contrat — une seule ligne compacte */}
      <div className="shrink-0 flex justify-center px-3 pt-1.5 relative">
        <div className="panel rounded-full px-4 py-1 flex items-center gap-2" style={{ borderColor: "#f59e0b88" }}>
          <span className="text-[10px]">🎯</span>
          <span className="text-sm font-bold text-amber-300 leading-none whitespace-nowrap"
            style={{ fontFamily: "Georgia, serif", textShadow: "0 2px 8px rgba(0,0,0,.6)" }}>{contract.label}</span>
          {me.posed ? <span className="text-[10px] text-lime-300 font-bold whitespace-nowrap">posé ✓</span>
            : !contract.poseTout && (
              <span className="text-[10px] text-emerald-300 whitespace-nowrap">
                {contract.tri > 0 && `Tri ${Math.min(stagedTri, contract.tri)}/${contract.tri}`}
                {contract.tri > 0 && contract.esc > 0 && " · "}
                {contract.esc > 0 && `Esc ${Math.min(stagedEsc, contract.esc)}/${contract.esc}`}
              </span>
            )}
        </div>
      </div>

      {/* Adversaires */}
      <div className="shrink-0 flex gap-2 px-3 pb-1 pt-3 overflow-x-auto">
        {opponents.map((p) => (
          <OpponentCard key={p.idx} p={p} active={g.turn === p.idx && !g.roundOver}
            seconds={g.turn === p.idx && !p.isBot ? turnSec : null} emote={emotes[p.idx]}
            refCb={(el) => { oppRefs.current[p.idx] = el; }} />
        ))}
      </div>

      {/* Journal résumé */}
      <div className="px-3 pb-1 text-[11px] text-emerald-200 leading-tight">
        {lastLogs.map((l, i) => <div key={i} className={i === lastLogs.length - 1 ? "text-amber-200" : "opacity-50"}>{l}</div>)}
      </div>

      {/* Table regroupée par joueur */}
      <div className="flex-1 relative" style={{ minHeight: 120 }}>
        <div ref={tableScrollRef} className="table-zone table-pad absolute inset-0 overflow-y-auto px-2 py-1">
          {g.melds.length === 0 && (
            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center px-6">
              <div className="text-6xl" style={{ opacity: 0.16, filter: "drop-shadow(0 4px 8px rgba(0,0,0,.4))" }}>🎴</div>
              <div className="text-sm text-emerald-300 italic mt-2" style={{ opacity: 0.6 }}>Les combinaisons posées apparaîtront ici</div>
              <div className="text-[11px] text-emerald-400 mt-1" style={{ opacity: 0.5 }}>Contrat de la manche : {contract.label}</div>
            </div>
          )}
          <GrilleAuto>
            {[...new Set(g.melds.map((m) => m.owner))].map((o) => (
              <div key={o} className="flex items-start gap-1.5">
                <span className="text-base shrink-0" style={{ width: 22, marginTop: 6 }} title={(srv.players[o] || {}).name}>
                  {(srv.players[o] || {}).avatar || "🙂"}
                </span>
                <LigneMelds>
                  {g.melds.filter((m) => m.owner === o).map((m) => (
                    <MeldChip key={m.id} mid={m.id} meld={m}
                      small={true}
                      highlight={(me.posed && selected.length === 1 && myTurn) || (Boolean(drag) && !drag.fromDiscard && me.posed && myTurn && g.phase === "play")}
                      onClick={() => { if (myTurn && selected.length === 1) { completeWith(m.id, selected[0]); setSelected([]); } }}
                      onLongPress={setZoomMeld} />
                  ))}
                </LigneMelds>
              </div>
            ))}
          </GrilleAuto>
        </div>
        {g.melds.length > 0 && (
          <button onClick={() => setShowTable(true)}
            className="absolute top-0.5 right-2 z-10 btn-gold rounded-xl px-2 py-1 text-[11px] font-bold shadow-xl">⛶ Tout voir</button>
        )}
      </div>

      {/* Bannières : mode auto, fenêtre d'achat, tour */}
      {me.absent ? (
        <div className="mx-3 my-1 py-2 rounded-xl panel text-center" style={{ borderColor: "#f87171" }}>
          <div className="text-xs text-red-300 font-bold">Mode automatique (l'IA joue pour toi)</div>
          <button onClick={() => act({ type: "resume" })} className="btn-gold px-4 py-1.5 rounded-xl text-xs font-bold mt-1">✋ Reprendre la main</button>
        </div>
      ) : buyOpen && g.buyNextIdx === youIdx ? (
        <div className="mx-3 my-1 py-2 px-3 rounded-xl panel pulse-gold flex items-center justify-center gap-3" style={{ borderColor: "#34d399" }}>
          {topDiscard && <Card card={topDiscard} small flat />}
          <div className="text-center">
            <div className="text-xs font-bold text-emerald-200">
              C'est ton tour ensuite — <span className="text-amber-300">tu es prioritaire</span> <span className="text-amber-300 text-sm">{secLeft(g.buyWindowUntil)}s</span>
            </div>
            <div className="flex gap-2 mt-1 justify-center">
              <button onClick={() => socket.emit("claimNext")}
                className="btn-green px-3 py-1.5 rounded-xl text-xs font-bold">👍 Je la prends (gratuit)</button>
              <button onClick={() => { socket.emit("passNext"); setPassedWindow(g.buyWindowUntil); }}
                className="btn-dark px-3 py-1.5 rounded-xl text-xs font-bold">Laisser</button>
            </div>
          </div>
        </div>
      ) : buyOpen && g.buyDiscarderIdx === youIdx ? (
        <div className="mx-3 my-1 py-1.5 rounded-xl panel text-center text-xs text-emerald-300">
          💰 Fenêtre d'achat en cours — les autres peuvent acheter la carte que tu viens de jeter…
        </div>
      ) : buyOpen ? (
        <div className="mx-3 my-1 py-2 px-3 rounded-xl panel pulse-gold flex items-center justify-center gap-3" style={{ borderColor: "#fbbf24" }}>
          {topDiscard && <Card card={topDiscard} small flat />}
          <div className="text-center">
            <div className="text-xs font-bold text-amber-200">
              Quelqu'un veut acheter ? <span className="text-amber-300 text-sm">{secLeft(g.buyWindowUntil)}s</span>
            </div>
            <div className="flex gap-2 mt-1 justify-center">
              <button onClick={() => act({ type: "buy" })} disabled={me.buysLeft <= 0}
                className="btn-gold px-3 py-1.5 rounded-xl text-xs font-bold disabled:opacity-40">💰 Acheter (+1 pénalité)</button>
              <button onClick={() => setPassedWindow(g.buyWindowUntil)} className="btn-dark px-3 py-1.5 rounded-xl text-xs font-bold">Passer</button>
            </div>
            {srv.options.pouvoirs !== false && (
              <div className="flex gap-2 mt-1.5 justify-center">
                <button onClick={() => peutAchatNet() ? act({ type: "buy", net: true }) : setMsg(messageVerrou(COUT_ACHAT_NET))} disabled={me.buysLeft <= 0}
                  title={"Achat net : la carte sans la carte de pénalité, pour " + COUT_ACHAT_NET + " diamants"}
                  className={(peutAchatNet() ? "btn-diamant" : "btn-dark opacity-70") + " px-2.5 py-1 rounded-lg text-[10px] font-bold disabled:opacity-40"}>{peutAchatNet() ? "✨" : "🔒"} Achat net · {COUT_ACHAT_NET} 💎</button>
                {me.buysLeft <= 0 && !me.extraBuyUsed && (
                  <button onClick={() => peutPayer(COUT_ACHAT_EXTRA) ? act({ type: "rechargeAchat" }) : setMsg(messageVerrou(COUT_ACHAT_EXTRA))}
                    title="Un 4e jeton d'achat pour cette manche (1 recharge max)"
                    className={(peutPayer(COUT_ACHAT_EXTRA) ? "btn-diamant" : "btn-dark opacity-70") + " px-2.5 py-1 rounded-lg text-[10px] font-bold"}>{peutPayer(COUT_ACHAT_EXTRA) ? "🛒" : "🔒"} +1 achat · {COUT_ACHAT_EXTRA} 💎</button>
                )}
              </div>
            )}
          </div>
        </div>
      ) : myTurn && pendingDiscard ? (
        <div className="mx-3 my-1 py-1.5 rounded-xl btn-red text-center text-sm font-bold animate-pulse">
          🔒 Touche la défausse pour confirmer ton jet — ou une carte de ta main pour annuler
        </div>
      ) : myTurn ? (

      {showLog && (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-end justify-center z-20" onClick={() => setShowLog(false)}>
          <div className="panel rounded-t-2xl p-4 w-full max-w-md max-h-[60vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
            <div className="flex justify-between items-center mb-1">
              <h3 className="text-amber-300 font-bold text-sm">Journal de la manche</h3>
              <button onClick={() => setShowLog(false)} className="text-emerald-300 text-sm px-2">Fermer ✕</button>
            </div>
            <p className="text-[10px] text-emerald-400 mb-2">⬇ Du plus récent au plus ancien</p>
            {(g.log || []).map((l, i) => ({ l, n: i + 1 })).reverse().map((x, i) => (
              <div key={x.n} className={`text-xs py-1 border-b border-emerald-900 flex gap-2 ${x.l.startsWith("—") ? "text-amber-300 font-bold" : i === 0 ? "text-amber-200 font-bold" : i < 4 ? "text-emerald-100" : "text-emerald-400"}`}>
                <span className="shrink-0 text-emerald-600" style={{ fontVariantNumeric: "tabular-nums" }}>{x.n}.</span>
                <span>{i === 0 && !x.l.startsWith("—") ? "🕐 " : ""}{x.l}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Fin de manche */}
      {g.roundOver && (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-6 z-10">
          <div className="panel rounded-2xl p-5 w-full max-w-xs text-emerald-100">
            <h2 className="text-amber-300 font-bold text-lg mb-1" style={{ fontFamily: "Georgia, serif" }}>
              {(srv.players[g.roundOver.winnerIdx] || {}).name} gagne la manche !
            </h2>
{g.roundOver.epuise && (
              <p className="text-[11px] text-amber-200 mb-2 leading-relaxed bg-emerald-950/60 border border-amber-500/30 rounded-xl px-3 py-2">
                ⚖️ <b>Manche insolvable</b> — la pioche a été rebattue 3 fois sans vainqueur : les cartes restantes ne permettaient plus à personne de finir. Dans ce cas, la règle donne la manche au joueur avec la <b>main la plus légère</b> (le moins de points en main), même s'il lui reste des cartes.
              </p>
            )}
            {g.roundOver.bonusType === "anticipe" && <p className="text-xs text-amber-200 mb-2">Pose-tout anticipé : bonus −{10 * srv.players.length} pts</p>}
            {g.roundOver.bonusType === "final" && <p className="text-xs text-amber-200 mb-2">Pose-tout final : bonus −{50 * srv.players.length} pts</p>}
            <div className="text-sm">
              {g.roundOver.summary.map((r, k) => (
                <div key={k} className="flex justify-between py-1 border-b border-emerald-800 last:border-0">
                  <span>{((srv.players.find((p) => p.name === r.name)) || {}).avatar} {r.name}</span>
                  <span>+{r.pts}{r.bonus !== 0 ? ` ${r.bonus}` : ""} → <b>{r.total}</b></span>
                </div>
              ))}
            </div>
            {srv.state === "roundEnd" && (actsAsHost ? (
              <button onClick={() => socket.emit("nextRound")} className="mt-4 w-full btn-gold font-bold py-2.5 rounded-xl">
                Manche {g.mancheIdx + 2} →
              </button>
            ) : (
              <p className="mt-4 text-center text-xs text-emerald-300 animate-pulse">L'hôte va lancer la manche suivante…</p>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment><App /><GainsToast /><AnnonceDiamants /><TarifsDiamants /><ObtenirDiamants /></React.Fragment>);
</script>
</body>
</html>
