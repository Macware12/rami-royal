// ---------- Aides ----------
const store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (_) {} },
  del(k) { try { window.localStorage.removeItem(k); } catch (_) {} },
};

// Remise à zéro ponctuelle (v2293) : les visiteurs SANS compte repartent comme à
// une première visite (page d'accueil, ordre des cartes, stats locales). Ne se
// produit qu'une seule fois — le marqueur empêche toute récidive. Les joueurs
// connectés ne sont pas touchés : leur progression vit dans leur compte.
(function () {
  try {
    const MARQUE = "rami-raz-2293";
    if (window.localStorage.getItem(MARQUE)) return;
    let compte = null;
    try { compte = JSON.parse(window.localStorage.getItem("rami-account") || "null"); } catch (_) {}
    if (!(compte && compte.code)) {
      const garder = { "rami-jeton": 1, "rami-admin-cle": 1 };
      const cles = [];
      for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && (k.indexOf("rami") === 0 || k.indexOf("ramimp") === 0) && !garder[k]) cles.push(k);
      }
      cles.forEach((k) => { try { window.localStorage.removeItem(k); } catch (_) {} });
    }
    window.localStorage.setItem(MARQUE, "1");
  } catch (_) {}
})();

// Préférences d'affichage (accessibilité)
// Décalage horloge serveur/client : mis à jour à chaque état reçu, corrige les comptes à rebours
let CLOCK_OFFSET = 0;
const srvNow = () => Date.now() + CLOCK_OFFSET;
// Chrono de partie : durée écoulée depuis le début (heure serveur), formatée mm:ss (ou h:mm:ss)
function fmtElapsed(startMs) {
  if (!startMs) return "";
  const s = Math.max(0, Math.floor((srvNow() - startMs) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = String(m).padStart(2, "0"), ss = String(sec).padStart(2, "0");
  return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
}
const UI_PREFS = {
  big: store.get("ramimp-big") === "1",
  four: store.get("ramimp-4col") === "1",
};
function suitInk(card) {
  if (card.joker) return "#7c3aed";
  if (card.suit === "♥") return "#C1272D";
  if (card.suit === "♦") return UI_PREFS.four ? "#2563eb" : "#C1272D";
  if (card.suit === "♣") return UI_PREFS.four ? "#15803d" : "#1c1917";
  return "#1c1917";
}

let SFX_MUTED = false;
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (_) {}
}
function tone(freq, dur, type, vol, when) {
  if (!audioCtx || SFX_MUTED) return;
  try {
    const t = audioCtx.currentTime + (when || 0);
    const o = audioCtx.createOscillator();
    const gn = audioCtx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    gn.gain.setValueAtTime(vol || 0.12, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + (dur || 0.12));
    o.connect(gn); gn.connect(audioCtx.destination);
    o.start(t); o.stop(t + (dur || 0.12) + 0.02);
  } catch (_) {}
}
function buzz(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (_) {}
}

function sfx(name) {
  if (name === "draw") buzz(15);
  else if (name === "take" || name === "buy") buzz(30);
  else if (name === "meld") buzz(45);
  else if (name === "discard") buzz(10);
  else if (name === "win") buzz([60, 60, 60, 60, 120]);

  if (SFX_MUTED) return;
  if (name === "draw") { tone(520, 0.07, "triangle", 0.08); tone(720, 0.06, "triangle", 0.06, 0.05); }
  else if (name === "discard") { tone(320, 0.09, "triangle", 0.1); }
  else if (name === "take" || name === "buy" || name === "exchange") { tone(880, 0.1, "sine", 0.12); tone(660, 0.12, "sine", 0.1, 0.08); }
  else if (name === "pose") { tone(523, 0.12, "sine", 0.14); tone(659, 0.12, "sine", 0.14, 0.1); tone(784, 0.16, "sine", 0.14, 0.2); }
  else if (name === "yourturn") { tone(880, 0.1, "sine", 0.1); tone(1175, 0.14, "sine", 0.1, 0.1); }
  else if (name === "win") { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, "sine", 0.14, i * 0.12)); }
}
function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (_) {} }

function rankLabel(c) {
  if (c.joker) return "JK";
  return { 1: "A", 11: "V", 12: "D", 13: "R" }[c.rank] || String(c.rank);
}
function cardName(c) { return c.joker ? "Joker" : rankLabel(c) + c.suit; }

// ---------- Validation locale (miroir du serveur, pour l'aide à la pose) ----------
function isTri(cards) {
  const reals = cards.filter((c) => !c.joker);
  if (reals.length < 3) return false;
  return reals.every((c) => c.rank === reals[0].rank);
}
function isEscalier(cards) {
  const jokers = cards.filter((c) => c.joker).length;
  const reals = cards.filter((c) => !c.joker);
  if (reals.length < 3) return false;
  const suit = reals[0].suit;
  if (!reals.every((c) => c.suit === suit)) return false;
  for (let off = 0; off < 13; off++) {
    const vals = reals.map((c) => (((c.rank - 1 - off) % 13) + 13) % 13).sort((a, b) => a - b);
    let ok = true;
    for (let i = 1; i < vals.length; i++) if (vals[i] === vals[i - 1]) { ok = false; break; }
    if (!ok) continue;
    let need = 0, feasible = true;
    for (let i = 1; i < vals.length; i++) {
      const gap = vals[i] - vals[i - 1] - 1;
      if (gap >= 2) { feasible = false; break; }
      need += gap;
    }
    if (!feasible) continue;
    const leftover = jokers - need;
    if (leftover < 0 || leftover > 2) continue;
    const span = vals[vals.length - 1] - vals[0] + 1;
    if (span + leftover > 13) continue;
    return true;
  }
  return false;
}

function helpArrangement(hand, contract, variant) {
  const used = new Set();
  const groups = [];
  const jokers = hand.filter((c) => c.joker);
  const reals = hand.filter((c) => !c.joker);
  const rotArr = (arr) => (arr.length ? arr.map((_, i) => arr[(i + variant) % arr.length]) : arr);

  // 1) Le contrat d'abord : le planificateur (jokers compris) réserve ce qu'il faut
  let planOK = false;
  if (!contract.poseTout && ((contract.tri || 0) > 0 || (contract.esc || 0) > 0)) {
    const plan = planContract(hand, { tri: contract.tri || 0, esc: contract.esc || 0 });
    if (plan) {
      planOK = true;
      for (const m of plan) {
        const cards = m.type === "esc" ? sortEscalier(m.cards) : m.cards;
        cards.forEach((c) => used.add(c.id));
        groups.push({ kind: m.type, cards, complete: true, forContract: true, withJoker: m.cards.some((c) => c.joker) });
      }
    }
  }

  const byRankGroups = () => {
    const m = {};
    reals.filter((c) => !used.has(c.id)).forEach((c) => { (m[c.rank] = m[c.rank] || []).push(c); });
    return m;
  };
  const takeRuns = () => {
    for (const run of rotArr(findRuns(hand))) {
      if (run.some((c) => used.has(c.id))) continue;
      run.forEach((c) => used.add(c.id));
      groups.push({ kind: "esc", cards: run, complete: true });
    }
  };
  const takeJokerRuns = () => {
    for (const jr of rotArr(findJokerRuns(hand))) {
      const jks = jokers.filter((c) => !used.has(c.id));
      if (!jks.length) break;
      if (jr.some((c) => used.has(c.id))) continue;
      const jk = jks[0];
      const cards = sortEscalier([...jr, jk]);
      cards.forEach((c) => used.add(c.id));
      groups.push({ kind: "esc", cards, complete: true, withJoker: true });
    }
  };
  const takeTris = () => {
    const m = byRankGroups();
    for (const r of rotArr(Object.keys(m))) {
      const grp = m[r].filter((c) => !used.has(c.id));
      if (grp.length >= 3) {
        grp.forEach((c) => used.add(c.id));
        groups.push({ kind: "tri", cards: grp, complete: true });
      }
    }
  };
  // On ne forme QUE les types demandés par le contrat : pas d'escalier pour un contrat 100% tris (et inversement)
  const wantEscAny = contract.poseTout || (contract.esc || 0) > 0;
  const wantTriAny = contract.poseTout || (contract.tri || 0) > 0;
  const preferEsc = contract.poseTout ? variant % 2 === 1
    : (contract.tri || 0) === 0 ? true
    : (contract.esc || 0) === 0 ? false
    : (contract.esc || 0) >= (contract.tri || 0) ? variant % 2 === 0 : variant % 2 === 1;
  if (preferEsc) { if (wantEscAny) { takeRuns(); takeJokerRuns(); } if (wantTriAny) takeTris(); }
  else { if (wantTriAny) takeTris(); if (wantEscAny) { takeRuns(); takeJokerRuns(); } }


  // Ébauches : paires (futur tri) et voisins de suite (futur escalier) — dans l'ordre du contrat
  const draftPairs = () => {
    const m2 = byRankGroups();
    for (const r of rotArr(Object.keys(m2))) {
      const grp = m2[r].filter((c) => !used.has(c.id));
      if (grp.length === 2) { grp.forEach((c) => used.add(c.id)); groups.push({ kind: "tri", cards: grp, complete: false }); }
    }
  };
  const draftSuites = () => {
    const bySuit = {};
    reals.filter((c) => !used.has(c.id)).forEach((c) => { (bySuit[c.suit] = bySuit[c.suit] || []).push(c); });
    for (const s of rotArr(Object.keys(bySuit))) {
      const arr = bySuit[s].sort((a, b) => a.rank - b.rank);
      for (let i = 0; i < arr.length - 1; i++) {
        const a = arr[i], b = arr[i + 1];
        if (used.has(a.id) || used.has(b.id)) continue;
        if (b.rank - a.rank <= 2) { used.add(a.id); used.add(b.id); groups.push({ kind: "esc", cards: [a, b], complete: false }); }
      }
    }
  };
  if (preferEsc) { if (wantEscAny) draftSuites(); if (wantTriAny) draftPairs(); }
  else { if (wantTriAny) draftPairs(); if (wantEscAny) draftSuites(); }
  // Les jokers libres rejoignent les ébauches (escaliers d'abord, puis paires)
  for (const grp of [...groups.filter((x) => !x.complete && x.kind === "esc"), ...groups.filter((x) => !x.complete && x.kind === "tri")]) {
    const jk = jokers.find((c) => !used.has(c.id));
    if (!jk) break;
    used.add(jk.id);
    grp.cards = [...grp.cards, jk];
    grp.plusJoker = true;
  }

  // Les cartes restantes qui prolongent un groupe complet rejoignent ce groupe
  // au lieu de rester isolées : 4e carte d'un tri, carte qui continue un escalier.
  for (const c of reals.filter((x) => !used.has(x.id))) {
    for (const g of groups) {
      if (!g.complete) continue;
      const ok = g.kind === "tri"
        ? g.cards.some((x) => !x.joker && x.rank === c.rank)
        : validGroup("esc", [...g.cards, c]);
      if (!ok) continue;
      g.cards = g.kind === "esc" ? sortEscalier([...g.cards, c]) : [...g.cards, c];
      used.add(c.id);
      break;
    }
  }

  const wantTri = contract.tri || 0, wantEsc = contract.esc || 0;
  const gScore = (x) => (x.forContract ? -20 : 0) + (x.complete ? 0 : 10) + ((x.kind === "tri" && wantTri > 0) || (x.kind === "esc" && wantEsc > 0) || contract.poseTout ? 0 : 5);
  const buckets = {};
  groups.forEach((x) => { const sc = gScore(x); (buckets[sc] = buckets[sc] || []).push(x); });
  const arranged = [];
  Object.keys(buckets).map(Number).sort((a, b) => a - b).forEach((sc) => {
    const b = buckets[sc];
    const off = variant % b.length;
    arranged.push(...b.slice(off), ...b.slice(0, off));
  });

  const order = [];
  arranged.forEach((gr) => order.push(...gr.cards));
  const leftKey = variant % 2 === 0
    ? (c) => SUITS.indexOf(c.suit) * 20 + c.rank
    : (c) => c.rank * 8 + SUITS.indexOf(c.suit);
  hand.filter((c) => !c.joker && !used.has(c.id)).sort((a, b) => leftKey(a) - leftKey(b)).forEach((c) => order.push(c));
  jokers.forEach((c) => { if (!used.has(c.id)) order.push(c); });

  const nTri = groups.filter((x) => x.kind === "tri" && x.complete).length;
  const nEsc = groups.filter((x) => x.kind === "esc" && x.complete && !x.withJoker).length;
  const jEsc = groups.filter((x) => x.complete && x.withJoker).length;
  const pTri = groups.filter((x) => x.kind === "tri" && !x.complete).length;
  const pEsc = groups.filter((x) => x.kind === "esc" && !x.complete).length;
  const pJk = groups.filter((x) => !x.complete && x.plusJoker).length;
  const parts = [];
  if (nTri) parts.push(nTri + " tri" + (nTri > 1 ? "s" : "") + " complet" + (nTri > 1 ? "s" : ""));
  if (nEsc) parts.push(nEsc + " escalier" + (nEsc > 1 ? "s" : "") + " complet" + (nEsc > 1 ? "s" : ""));
  if (jEsc) parts.push(jEsc + " avec joker 🤡");
  if (pTri) parts.push(pTri + " paire" + (pTri > 1 ? "s" : "") + " (futur tri)");
  if (pEsc) parts.push(pEsc + " début" + (pEsc > 1 ? "s" : "") + " d'escalier" + (pJk ? " (joker accolé)" : ""));
  const summary = (planOK ? "🎯 ton contrat est réalisable ! " : "") + (parts.length ? "repérés : " + parts.join(" · ") : "rien à regrouper pour l'instant, pioche encore !");
  return { order, summary };
}

function isOrderedEscalier(cards) {
  if (cards.length < 3 || cards.length > 13) return false;
  for (let i = 1; i < cards.length; i++) if (cards[i].joker && cards[i - 1].joker) return false;
  const reals = cards.map((c, i) => ({ c, i })).filter((x) => !x.c.joker);
  if (reals.length < 3) return false;
  const suit = reals[0].c.suit;
  if (!reals.every((x) => x.c.suit === suit)) return false;
  const base = (reals[0].c.rank - 1) - reals[0].i;
  for (const x of reals) {
    if (((((x.c.rank - 1) - x.i - base) % 13) + 13) % 13 !== 0) return false;
  }
  return true;
}

function sortEscalier(cards) {
  if (isOrderedEscalier(cards)) return cards;
  const jokers = cards.filter((c) => c.joker);
  const reals = cards.filter((c) => !c.joker);
  if (reals.length === 0) return cards;
  for (let off = 0; off < 13; off++) {
    const items = reals.map((c) => ({ c, v: (((c.rank - 1 - off) % 13) + 13) % 13 })).sort((a, b) => a.v - b.v);
    let okDist = true;
    for (let i = 1; i < items.length; i++) if (items[i].v === items[i - 1].v) { okDist = false; break; }
    if (!okDist) continue;
    let need = 0, feasible = true;
    for (let i = 1; i < items.length; i++) {
      const gap = items[i].v - items[i - 1].v - 1;
      if (gap >= 2) { feasible = false; break; }
      need += gap;
    }
    if (!feasible) continue;
    const leftover = jokers.length - need;
    if (leftover < 0 || leftover > 2) continue;
    const span = items[items.length - 1].v - items[0].v + 1;
    if (span + leftover > 13) continue;
    const out = [];
    let ji = 0;
    if (leftover === 2) out.push(jokers[ji++]);
    for (let i = 0; i < items.length; i++) {
      if (i > 0) {
        const gap = items[i].v - items[i - 1].v - 1;
        for (let k = 0; k < gap; k++) out.push(jokers[ji++]);
      }
      out.push(items[i].c);
    }
    while (ji < jokers.length) out.push(jokers[ji++]);
    return out;
  }
  return cards;
}
function normMeld(type, cards) { return type === "esc" ? sortEscalier(cards) : cards; }

function findRuns(hand) {
  const bySuit = {};
  hand.filter((c) => !c.joker).forEach((c) => { (bySuit[c.suit] = bySuit[c.suit] || []).push(c); });
  const runs = [];
  const seenSig = new Set();
  for (const s in bySuit) {
    const byRank = {};
    bySuit[s].forEach((c) => { if (!byRank[c.rank]) byRank[c.rank] = c; });
    const present = Object.keys(byRank).map(Number);
    if (present.length < 3) continue;
    const line = [...new Set(present.flatMap((r) => [r, r + 13]))].sort((a, b) => a - b);
    let run = [line[0]];
    const flush = () => {
      if (run.length < 3) return;
      const seen = new Set(), cards = [];
      for (const v of run) {
        const card = byRank[((v - 1) % 13) + 1];
        if (!card || seen.has(card.id)) break;
        seen.add(card.id); cards.push(card);
      }
      if (cards.length < 3) return;
      const sig = cards.map((c) => c.id).sort().join(",");
      if (seenSig.has(sig)) return;
      seenSig.add(sig);
      runs.push(cards);
    };
    for (let i = 1; i < line.length; i++) {
      if (line[i] === run[run.length - 1] + 1) run.push(line[i]);
      else { flush(); run = [line[i]]; }
    }
    flush();
  }
  runs.sort((a, b) => b.length - a.length);
  return runs;
}
function findJokerRuns(hand) {
  const bySuit = {};
  hand.filter((c) => !c.joker).forEach((c) => { (bySuit[c.suit] = bySuit[c.suit] || []).push(c); });
  const out = [];
  const seenSig = new Set();
  for (const s in bySuit) {
    const byRank = {};
    bySuit[s].forEach((c) => { if (!byRank[c.rank]) byRank[c.rank] = c; });
    const present = Object.keys(byRank).map(Number);
    if (present.length < 3) continue;
    const line = [...new Set(present.flatMap((r) => [r, r + 13]))].sort((a, b) => a - b);
    for (let i = 0; i + 2 < line.length; i++) {
      if (line[i + 2] - line[i] === 3) {
        const cards = [line[i], line[i + 1], line[i + 2]].map((v) => byRank[((v - 1) % 13) + 1]);
        if (new Set(cards.map((c) => c.id)).size !== 3) continue;
        const sig = cards.map((c) => c.id).sort().join(",");
        if (seenSig.has(sig)) continue;
        seenSig.add(sig);
        out.push(cards);
      }
    }
  }
  return out;
}
// Tris candidats : groupe complet d'abord (poser un max), puis sous-ensembles de 3 (repli si conflit)
function enumTris(hand) {
  const byRank = {};
  hand.forEach((c) => { if (!c.joker) (byRank[c.rank] = byRank[c.rank] || []).push(c); });
  const out = [];
  for (const r in byRank) {
    const g = byRank[r];
    if (g.length < 3) continue;
    if (g.length > 3) out.push(g.slice());
    for (let a = 0; a < g.length; a++)
      for (let b = a + 1; b < g.length; b++)
        for (let d = b + 1; d < g.length; d++) out.push([g[a], g[b], g[d]]);
  }
  return out;
}
// Escaliers candidats : tous les sous-runs (>=3, boucles comprises), + escaliers à 1 joker (un seul trou)
function enumEscs(hand, withJoker) {
  const bySuit = {};
  hand.forEach((c) => { if (!c.joker) { bySuit[c.suit] = bySuit[c.suit] || {}; if (!bySuit[c.suit][c.rank]) bySuit[c.suit][c.rank] = c; } });
  const out = [];
  const seen = new Set();
  for (const s in bySuit) {
    const byRank = bySuit[s];
    const present = Object.keys(byRank).map(Number);
    if (present.length < 2) continue;
    const line = [...new Set(present.flatMap((r) => [r, r + 13]))].sort((a, b) => a - b);
    const segs = []; let seg = [line[0]];
    for (let i = 1; i < line.length; i++) { if (line[i] === seg[seg.length - 1] + 1) seg.push(line[i]); else { segs.push(seg); seg = [line[i]]; } }
    segs.push(seg);
    for (const g of segs) {
      for (let len = 3; len <= g.length && len <= 13; len++)
        for (let off = 0; off + len <= g.length; off++) {
          const cs = []; const idset = new Set(); let bad = false;
          for (let k = off; k < off + len; k++) { const c = byRank[((g[k] - 1) % 13) + 1]; if (!c || idset.has(c.id)) { bad = true; break; } idset.add(c.id); cs.push(c); }
          if (bad) continue;
          const sig = cs.map((c) => c.id).sort().join(",");
          if (!seen.has(sig)) { seen.add(sig); out.push({ cards: cs, jokerNeed: 0 }); }
        }
    }
    if (withJoker) {
      for (let i = 0; i + 2 < line.length; i++) {
        if (line[i + 2] - line[i] === 3) {
          const cs = [line[i], line[i + 1], line[i + 2]].map((v) => byRank[((v - 1) % 13) + 1]);
          if (new Set(cs.map((c) => c.id)).size !== 3) continue;
          const sig = "J" + cs.map((c) => c.id).sort().join(",");
          if (!seen.has(sig)) { seen.add(sig); out.push({ cards: cs, jokerNeed: 1 }); }
        }
      }
    }
  }
  out.sort((a, b) => (a.jokerNeed - b.jokerNeed) || (b.cards.length - a.cards.length));
  return out;
}
// Planificateur avec retour arrière : trouve une combinaison DISJOINTE dès qu'elle existe
function planContract(hand, need) {
  const needT = need.tri || 0, needE = need.esc || 0;
  if (needT === 0 && needE === 0) return [];
  const jokers = hand.filter((c) => c.joker);
  const triCands = enumTris(hand);
  const escCands = enumEscs(hand, jokers.length > 0);
  const used = new Set();
  let jokersLeft = jokers.length, steps = 0;
  function dfs(melds, ti, ei) {
    if (ti >= needT && ei >= needE) return melds;
    if (++steps > 200000) return null;
    if (ti < needT) {
      for (const t of triCands) {
        if (t.some((c) => used.has(c.id))) continue;
        t.forEach((c) => used.add(c.id));
        const r = dfs([...melds, { type: "tri", cards: t }], ti + 1, ei);
        if (r) return r;
        t.forEach((c) => used.delete(c.id));
      }
      return null;
    }
    for (const e of escCands) {
      if (e.jokerNeed > jokersLeft) continue;
      if (e.cards.some((c) => used.has(c.id))) continue;
      let jk = null;
      if (e.jokerNeed) { jk = jokers.find((j) => !used.has(j.id)); if (!jk) continue; }
      e.cards.forEach((c) => used.add(c.id));
      let cards = e.cards;
      if (jk) { used.add(jk.id); jokersLeft--; cards = sortEscalier([...e.cards, jk]); }
      const r = dfs([...melds, { type: "esc", cards }], ti, ei + 1);
      if (r) return r;
      e.cards.forEach((c) => used.delete(c.id));
      if (jk) { used.delete(jk.id); jokersLeft++; }
    }
    return null;
  }
  return dfs([], 0, 0);
}
function planFullHand(hand) {
  const used = new Set();
  const melds = [];
  for (const run of findRuns(hand)) {
    if (run.some((c) => used.has(c.id))) continue;
    run.forEach((c) => used.add(c.id));
    melds.push({ type: "esc", cards: run });
  }
  const byRank = {};
  hand.filter((c) => !c.joker && !used.has(c.id)).forEach((c) => { (byRank[c.rank] = byRank[c.rank] || []).push(c); });
  for (const r in byRank) {
    if (byRank[r].length >= 3) { byRank[r].forEach((c) => used.add(c.id)); melds.push({ type: "tri", cards: byRank[r] }); }
  }
  const leftover = hand.filter((c) => !used.has(c.id));
  const jokersLeft = leftover.filter((c) => c.joker);
  if (leftover.length !== jokersLeft.length) return null;
  if (jokersLeft.length > 0) {
    const tri = melds.find((m) => m.type === "tri");
    if (!tri) return null;
    tri.cards = [...tri.cards, ...jokersLeft];
  }
  return melds.length > 0 ? melds : null;
}

function MeldChip({ meld, ownerName, onClick, highlight, mid, small, onLongPress }) {
  // Maintien (250 ms) → ouvre l'éventail ; le relâchement le ferme (géré par le parent via window).
  // Le clic court garde son rôle (compléter) ; s'il y a eu maintien, on annule le clic.
  const lp = React.useRef({ t: null, fired: false, x: 0, y: 0 });
  const start = (x, y) => {
    lp.current.fired = false; lp.current.x = x; lp.current.y = y;
    if (!onLongPress) return;
    clearTimeout(lp.current.t);
    lp.current.t = setTimeout(() => { lp.current.fired = true; if (navigator.vibrate) navigator.vibrate(20); onLongPress(meld); }, 250);
  };
  const move = (x, y) => { if (!lp.current.fired && (Math.abs(x - lp.current.x) > 12 || Math.abs(y - lp.current.y) > 12)) clearTimeout(lp.current.t); };
  const end = () => clearTimeout(lp.current.t);
  const click = (e) => { if (lp.current.fired) { e.preventDefault(); lp.current.fired = false; return; } if (onClick) onClick(e); };
  return (
    <button onClick={click} data-mid={mid}
      onTouchStart={(e) => { const t = e.touches[0]; start(t.clientX, t.clientY); }}
      onTouchMove={(e) => { const t = e.touches[0]; move(t.clientX, t.clientY); }}
      onTouchEnd={end}
      onPointerDown={(e) => { if (e.pointerType !== "touch") start(e.clientX, e.clientY); }}
      onPointerMove={(e) => { if (e.pointerType !== "touch") move(e.clientX, e.clientY); }}
      onPointerUp={(e) => { if (e.pointerType !== "touch") end(); }}
      onContextMenu={(e) => e.preventDefault()}
      className={`shrink-0 flex items-center rounded-xl px-1 py-1 panel transition-all ${highlight ? "pulse-gold" : ""}`}
      style={{ touchAction: "none", ...(highlight ? { borderColor: "#fbbf24" } : {}) }}>
      <span className="text-[8px] uppercase text-emerald-400 font-bold mr-0.5" style={{ writingMode: "vertical-rl", textOrientation: "upright", letterSpacing: -2 }}>
        {meld.type === "tri" ? "TRI" : "ESC"}
      </span>
      <div className="flex">
        {meld.cards.map((c, i) => <StackCard key={c.id} card={c} overlap={i > 0} small={small} />)}
      </div>
    </button>
  );
}

function FlyingCard({ from, to, card, faceDown, delay, emphasis, onDone }) {

  const dx = to.x - from.x, dy = to.y - from.y;

// Ligne de combinaisons d'un joueur : se rétrécit automatiquement pour tenir sur UNE ligne.
// En dessous de 55 % de la taille normale, on préfère repasser à la ligne (lisibilité d'abord).
// La grille de la table se rétrécit d'elle-même (zoom) pour tout montrer sans scroll :
// sur iPhone, 4-6 joueurs qui posent tenaient plus dans l'écran — on scrollait sans fin.
// Surface commune de deux rectangles (désambiguïse défausse vs main pour la carte glissée)
function aireCommune(a, b) {
  if (!a || !b) return 0;
  return Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left)) *
         Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
}

function GrilleAuto({ children }) {
  const ref = React.useRef(null);
  const ajuster = () => {
    const el = ref.current;
    if (!el || !el.parentElement) return;
    el.style.zoom = "1";
    const dispo = el.parentElement.clientHeight - 10;
    const ratio = el.scrollHeight > 0 ? dispo / el.scrollHeight : 1;
    if (ratio < 1) el.style.zoom = String(Math.max(0.58, ratio - 0.01));
  };
  React.useLayoutEffect(ajuster);
  React.useEffect(() => {
    window.addEventListener("resize", ajuster);
    return () => window.removeEventListener("resize", ajuster);
  }, []);
  return <div ref={ref} className="table-grille">{children}</div>;
}

function LigneMelds({ children }) {
  const ref = useRef(null);
  const ajuster = () => {
    const el = ref.current;
    if (!el) return;
    el.style.zoom = "1";
    el.style.flexWrap = "nowrap";
    const ratio = el.scrollWidth > 0 ? el.clientWidth / el.scrollWidth : 1;
    if (ratio >= 1) return;
    if (ratio >= 0.55) el.style.zoom = String(Math.max(0.55, ratio - 0.01));
    else el.style.flexWrap = "wrap";
  };
  React.useLayoutEffect(ajuster);
  useEffect(() => {
    window.addEventListener("resize", ajuster);
    return () => window.removeEventListener("resize", ajuster);
  }, []);
  return <div ref={ref} className="flex gap-1.5 items-center flex-1 min-w-0">{children}</div>;
}

// ---------- Missions du jour ----------
// Le serveur choisit 3 missions quotidiennes ; la progression est comptée ici via
// l'événement "rami-mission" (type, n) émis aux moments-clés du jeu, puis les missions
// terminées sont validées auprès du serveur (récompense en diamants + toast).
function missionsCle() { return "rami-missions-" + new Date().toISOString().slice(0, 10); }
function missionsEtat() {
  try { return JSON.parse(store.get(missionsCle())) || { prog: {}, valide: [] }; } catch (_) { return { prog: {}, valide: [] }; }
}
function missionsCatalogue() {
  try { return JSON.parse(store.get("rami-missions-cat")) || null; } catch (_) { return null; }
}
function chargerMissions() {
  const cat = missionsCatalogue();
  const auj = new Date().toISOString().slice(0, 10);
  if (cat && cat.date === auj) return Promise.resolve(cat);
  return fetch(API_BASE + "/missions/jour").then((r) => r.json())
    .then((d) => { store.set("rami-missions-cat", JSON.stringify(d)); try { window.dispatchEvent(new CustomEvent("rami-mission-maj")); } catch (_) {} return d; })
    .catch(() => cat);
}
function signalerMission(type, n) {
  try { window.dispatchEvent(new CustomEvent("rami-mission", { detail: { type, n: n || 1 } })); } catch (_) {}
}
// Compte la progression et valide auprès du serveur ce qui est terminé
function brancherMissions() {
  window.addEventListener("rami-mission", (e) => {
    const cat = missionsCatalogue();
    if (!cat || !e.detail) return;
    const etat = missionsEtat();
    etat.prog[e.detail.type] = (etat.prog[e.detail.type] || 0) + (e.detail.n || 1);
    store.set(missionsCle(), JSON.stringify(etat));
    try { window.dispatchEvent(new CustomEvent("rami-mission-maj")); } catch (_) {}
    flushMissions();
  });
}
let missionsEnCours = false;
function flushMissions() {
  if (missionsEnCours) return;
  const cat = missionsCatalogue();
  if (!cat || cat.date !== new Date().toISOString().slice(0, 10)) return;
  let acc = {};
  try { acc = JSON.parse(store.get("rami-account")) || {}; } catch (_) {}
  if (!acc.code) return; // invité : la progression attend une connexion pour être encaissée
  const etat = missionsEtat();
  const aValider = cat.missions.find((m) => (etat.prog[m.type] || 0) >= m.cible && !etat.valide.includes(m.id));
  if (!aValider) return;
  missionsEnCours = true;
  fetch(API_BASE + "/missions/valider", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: acc.code, date: cat.date, id: aValider.id }),
  }).then((r) => (r.ok ? r.json() : null))
    .then((d) => {
      missionsEnCours = false;
      if (!d || !d.ok) return;
      const e2 = missionsEtat();
      if (!e2.valide.includes(aValider.id)) e2.valide.push(aValider.id);
      store.set(missionsCle(), JSON.stringify(e2));
      try { window.dispatchEvent(new CustomEvent("rami-mission-maj")); } catch (_) {}
      if (d.gains && d.gains.total) signalerGains(d);
      flushMissions(); // il peut y en avoir une autre de prête
    })
    .catch(() => { missionsEnCours = false; });
}
brancherMissions();
chargerMissions();

// Toast des diamants gagnées : écoute l'événement "rami-gains" émis après chaque

  if (dep) {
    const debit = dep.montant < 0;
    return (

      </div>

  }
  const g = info.gains;
  const det = [];
  if (g.partie) det.push("partie +" + g.partie);
  if (g.defi) det.push("défi +" + g.defi);
  if (g.victoire) det.push("victoire +" + g.victoire);
  if (g.succes) det.push("succès +" + g.succes);
  if (g.serie) det.push("série " + g.serieJours + " j +" + g.serie);

  return (
    <div className="fixed left-1/2 -translate-x-1/2 z-40 px-4 py-2.5 rounded-2xl text-sm font-bold text-amber-200 text-center cursor-pointer"
      style={{ top: "calc(env(safe-area-inset-top, 0px) + 10px)", background: "linear-gradient(180deg, rgba(6,58,42,.97), rgba(4,40,28,.97))", border: "1px solid #f59e0b88", boxShadow: "0 6px 18px rgba(0,0,0,.45)" }}

    </div>

// Solde compact pour les espaces étroits (badge, chip) : 12 400 → « 12 k », 1 500 000 → « 1,5 M »
function fmtSolde(n) {
  n = n || 0;
  if (n >= 1e9) return (Math.round(n / 1e8) / 10).toLocaleString("fr-FR") + " Md";
  if (n >= 1e6) return (Math.round(n / 1e5) / 10).toLocaleString("fr-FR") + " M";
  if (n >= 1e4) return Math.round(n / 1e3).toLocaleString("fr-FR") + " k";
  return String(n);
}

// ---------- Application ----------
// Adresse du serveur : vide sur le web (même origine), absolue dans l'app native (voir config.js)
const API_BASE = (window.RAMI_CONFIG && window.RAMI_CONFIG.server) || "";
const realSocket = API_BASE ? io(API_BASE) : io();
// Enveloppe réseau : bascule entre le serveur en ligne et la partie LOCALE (app, sans internet).
// L'interface utilise « socket » sans savoir lequel est branché derrière.
const socket = {
  _local: null,
  _subs: [], // [ev, fn, fnEnveloppée]
  get isLocal() { return Boolean(this._local); },
  get connected() { return this._local ? true : realSocket.connected; },
  get io() { return realSocket.io; },
  connect() { if (!this._local) realSocket.connect(); },
  on(ev, fn) {
    const wrapped = (...a) => { if (!socket._local) fn(...a); }; // en mode local, le serveur en ligne est ignoré
    this._subs.push([ev, fn, wrapped]);
    realSocket.on(ev, wrapped);
    if (this._local) this._local.on(ev, fn);
    return this;
  },
  off(ev, fn) {
    this._subs = this._subs.filter(([e, f, w]) => {
      const match = e === ev && (!fn || f === fn);
      if (match) { realSocket.off(ev, w); if (this._local) this._local.off(ev, f); }
      return !match;
    });
    return this;
  },
  emit(ev, ...a) {
    if (this._local) this._local.emit(ev, ...a);
    else realSocket.emit(ev, ...a);
    return this;
  },
  goLocal() {
    if (this._local || !window.RamyLocalNet || !window.RamyLocalNet.available()) return false;
    this._local = window.RamyLocalNet.create();
    this._subs.forEach(([ev, fn]) => this._local.on(ev, fn));
    return true;
  },
  goOnline() {
    if (this._local) { const l = this._local; this._local = null; l.destroy(); }
  },
};
function cleDuJour() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
// Partage du score : image prête pour WhatsApp & co
function partagerScore(ranking, defi) {
  const W = 1080, H = 1080;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const cx = cv.getContext("2d");
  const grad = cx.createRadialGradient(W / 2, H * 0.25, 80, W / 2, H / 2, H);
  grad.addColorStop(0, "#1a6b42"); grad.addColorStop(0.55, "#14532d"); grad.addColorStop(1, "#052e16");
  cx.fillStyle = grad; cx.fillRect(0, 0, W, H);
  cx.textAlign = "center";
  cx.shadowColor = "rgba(0,0,0,.5)"; cx.shadowBlur = 18;
  cx.fillStyle = "#fcd34d"; cx.font = "bold 110px Georgia, serif";
  cx.fillText("Ramy Gasy", W / 2, 170);
  cx.shadowBlur = 0;
  cx.fillStyle = "#a7f3d0"; cx.font = "42px Georgia, serif";
  cx.fillText(defi ? "Défi du jour — " + new Date().toLocaleDateString("fr-FR") : "Partie terminée !", W / 2, 245);
  const px = 120, py = 320, pw = W - 240, ph = ranking.length * 95 + 60;
  cx.fillStyle = "rgba(4,40,28,.92)";
  cx.beginPath(); cx.roundRect(px, py, pw, ph, 28); cx.fill();
  cx.strokeStyle = "rgba(20,112,82,.6)"; cx.lineWidth = 3; cx.stroke();
  ranking.forEach((p, i) => {
    const y = py + 85 + i * 95;
    cx.textAlign = "left";
    cx.fillStyle = i === 0 ? "#fcd34d" : "#d1fae5";
    cx.font = (i === 0 ? "bold " : "") + "52px Georgia, serif";
    cx.fillText((i === 0 ? "👑 " : (i + 1) + ". ") + (p.avatar || "") + " " + p.name, px + 50, y);
    cx.textAlign = "right";
    cx.fillText(p.total + " pts", px + pw - 50, y);
  });
  cx.textAlign = "center";
  cx.fillStyle = "#6ee7b7"; cx.font = "36px Georgia, serif";
  cx.fillText("Le rami à contrats de Madagascar", W / 2, H - 120);
  cx.fillStyle = "#fcd34d"; cx.font = "bold 40px Georgia, serif";
  cx.fillText("rami-royal.onrender.com", W / 2, H - 60);
  const texte = "🎴 Ramy Gasy — " + ranking[0].name + " gagne avec " + ranking[0].total + " pts ! Viens jouer : https://rami-royal.onrender.com";
  cv.toBlob((blob) => {
    const fichier = blob ? new File([blob], "ramy-gasy-score.png", { type: "image/png" }) : null;
    if (fichier && navigator.canShare && navigator.canShare({ files: [fichier] })) {
      navigator.share({ files: [fichier], text: texte }).catch(() => {});
    } else if (navigator.share) {
      navigator.share({ text: texte }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(texte).then(() => alert("Message copié — colle-le à tes amis !")).catch(() => {});

  }, "image/png");

// ---------- File d'attente des parties terminées (comptage par deltas) ----------
function flushParties() {
  const acc = readJSONls("rami-account");
  if (!acc.code) return;
  let file = [];
  try { file = JSON.parse(store.get("rami-parties") || "[]"); } catch (_) { file = []; }
  if (!file.length) return;
  fetch(API_BASE + "/compte/partie", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ code: acc.code, succes: readJSONls("rami-succes") }, file[0])),
  })
    .then((r) => r.json().then((d) => ({ ok: r.ok, status: r.status, d })))
    .then(({ ok, status, d }) => {
      if (!ok) {
        if (status === 404 || status === 403) store.del("rami-parties");
        return;
      }
      file.shift();
      store.set("rami-parties", JSON.stringify(file));
      if (d && d.stats) { store.set("rami-stats", JSON.stringify(d.stats)); store.set("rami-succes", JSON.stringify(d.succes || {})); }
      if (d && d.gains && d.gains.total > 0) signalerGains(d);
      if (file.length) flushParties();
    })
    .catch(() => {});
}
// L'Aide est offerte 3 fois par partie, puis coûte des diamants
const AIDES_GRATUITES = 1; // une aide offerte par manche, ensuite payante
const COUT_AIDE = 5;
// Achat « net » : la carte de la défausse SANS la carte de pénalité (consomme un jeton 🛒)
const COUT_ACHAT_NET = 15;
const COUT_ACHAT_EXTRA = 20; // 4e jeton d'achat de la manche (1 recharge max)
const COUT_JOKER = 30;       // un joker sorti de la pioche (1 fois par manche)
// Le joueur connecté a-t-il les moyens ? (compte requis)
function peutPayer(montant) {
  try { const a = JSON.parse(store.get("rami-account")) || {}; return Boolean(a.code) && (a.pieces || 0) >= montant; } catch (_) { return false; }
}
const peutAchatNet = () => peutPayer(COUT_ACHAT_NET);
// Message affiché quand un pouvoir 💎 est verrouillé (invité ou solde insuffisant)
function messageVerrou(prix) {
  let acc = {};
  try { acc = JSON.parse(store.get("rami-account")) || {}; } catch (_) {}
  if (!acc.code) return "🔒 Crée un compte (gratuit, pastille 👤) pour utiliser les pouvoirs 💎 — et reçois 100 💎 de bienvenue !";
  return "🔒 Il te manque " + (prix - (acc.pieces || 0)) + " 💎 pour ce pouvoir (solde : " + (acc.pieces || 0) + " 💎).";
}
const LIBELLES_DEPENSE = { aide: "aide", "achat-net": "achat net", "achat-extra": "4e jeton d'achat", joker: "joker invoqué" };
// Débite des diamants (optimiste : l'interface bouge tout de suite, le serveur confirme)
function depenserPieces(montant, motif) {
  let acc = {};
  try { acc = JSON.parse(store.get("rami-account")) || {}; } catch (_) {}
  if (!acc.code) return;
  acc.pieces = Math.max(0, (acc.pieces || 0) - montant);
  store.set("rami-account", JSON.stringify(acc));
  try { window.dispatchEvent(new CustomEvent("rami-gains", { detail: { pieces: acc.pieces, depense: { montant: -montant, motif: LIBELLES_DEPENSE[motif] || motif } } })); } catch (_) {}
  fetch(API_BASE + "/compte/depenser", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: acc.code, montant, motif }),
  }).then((r) => (r.ok ? r.json() : null))
    .then((d) => {
      if (!d || typeof d.pieces !== "number") return;
      try {
        const a2 = JSON.parse(store.get("rami-account")) || {};
        a2.pieces = d.pieces;
        store.set("rami-account", JSON.stringify(a2));
        window.dispatchEvent(new CustomEvent("rami-gains", { detail: { pieces: d.pieces } }));
      } catch (_) {}
    })
    .catch(() => {}); // hors ligne : le débit optimiste local suffit
}

// Solde mis à jour + toast : appelé quand le serveur confirme des diamants gagnées
function signalerGains(d) {
  try {
    const acc = JSON.parse(store.get("rami-account")) || {};
    if (acc.code && typeof d.pieces === "number") {
      acc.pieces = d.pieces;
      if (d.gains && d.gains.serieJours) acc.serie = d.gains.serieJours;
      store.set("rami-account", JSON.stringify(acc));
    }
  } catch (_) {}
  try { window.dispatchEvent(new CustomEvent("rami-gains", { detail: d })); } catch (_) {}
}
function pousserPartie(delta) {
  let file = [];
  try { file = JSON.parse(store.get("rami-parties") || "[]"); } catch (_) {}
  file.push(delta);
  if (file.length > 50) file = file.slice(-50);
  store.set("rami-parties", JSON.stringify(file));
  flushParties();
}

    const cards = visibleHand.filter((c) => selected.includes(c.id));
    if (cards.length < 3 || !(type === "tri" ? isTri(cards) : isEscalier(cards))) { setMsg("Sélection invalide."); return; }
    setStaged((st) => [...st, { type, cards: normMeld(type, cards) }]);
    setSelected([]); setMsg("");
  }
  function unstage(i) { setStaged((st) => st.filter((_, k) => k !== i)); }

  function addToStagedCards(gi, cardIds) {
    const grp = staged[gi];
    if (!grp || (me && me.posed)) return;
    const cards = visibleHand.filter((c) => cardIds.includes(c.id));
    if (cards.length === 0) return;
    const candidate = [...grp.cards, ...cards];
    const okG = grp.type === "tri" ? isTri(candidate) : isEscalier(candidate);
    if (!okG) {
      setMsg("Cette carte ne va pas dans ce " + (grp.type === "tri" ? "tri" : "escalier") + ".");
      return;
    }
    setStaged((st) => st.map((m, k) => (k === gi ? { ...m, cards: normMeld(m.type, candidate) } : m)));
    setSelected([]);
    setMsg("Carte ajoutée au groupe ✓");
    sfx("draw");
  }

  function addToStaged(gi) {
    if (selected.length === 0) { setMsg("Sélectionne d'abord la carte à ajouter, puis touche le groupe."); return; }
    addToStagedCards(gi, selected);
  }

  function sendEmote(text) {
    const now = Date.now();
    if (now - lastEmoteSent.current < 1000) return;
    lastEmoteSent.current = now;
    socket.emit("emote", text);
    setShowEmotes(false);
  }

  function helpSort() {
    const ai = aidesInfo();
    if (ai.n >= AIDES_GRATUITES) {
      let acc = {};
      try { acc = JSON.parse(store.get("rami-account")) || {}; } catch (_) {}
      if (!acc.code) { setMsg("💡 Ton aide offerte de la manche est utilisée — crée un compte (pastille en haut à droite) pour continuer (" + COUT_AIDE + " 💎 par aide)."); return; }
      if ((acc.pieces || 0) < COUT_AIDE) { setMsg("💡 Aides gratuites épuisées — il te faut " + COUT_AIDE + " diamants (solde : 💎 " + (acc.pieces || 0) + "). Termine des parties pour en gagner !"); return; }
      depenserPieces(COUT_AIDE, "aide");
    }
    ai.n += 1;
    // Le contrat restant tient compte des groupes déjà préparés dans « Prêt »
    const remaining = contract && !contract.poseTout
      ? { ...contract, tri: Math.max(0, (contract.tri || 0) - stagedTri), esc: Math.max(0, (contract.esc || 0) - stagedEsc) }
      : contract;
    const contractReady = remaining && !remaining.poseTout && (remaining.tri || 0) === 0 && (remaining.esc || 0) === 0;
    const cur = visibleHand.map((c) => c.id).join(",");
    let res = null, changed = false;
    for (let k = 0; k < 8; k++) {
      helpCount.current += 1;
      const r = helpArrangement(visibleHand, remaining, helpCount.current);
      if (!res) res = r;
      if (r.order.map((c) => c.id).join(",") !== cur) { res = r; changed = true; break; }
    }
    const visibleSet = new Set(visibleHand.map((c) => c.id));
    orderRef.current = [...res.order.map((c) => c.id), ...orderRef.current.filter((id) => !visibleSet.has(id))];
    setMsg((changed ? "💡 " : "💡 Pas d'autre classement possible — ") + (contractReady ? "🎯 ton contrat est prêt — pose-le ! " : "") + res.summary);
    setTick((x) => x + 1);
  }

  function autoStage() {
    if (!contract || (me && me.posed)) return;
    if (contract.poseTout) {
      const plan = planFullHand(visibleHand);
      if (!plan || plan.reduce((n, m) => n + m.cards.length, 0) !== visibleHand.length) { setMsg("Ta main ne peut pas encore être posée en entier — continue à piocher !"); return; }
      setStaged((st) => [...st, ...plan.map((m) => ({ ...m, cards: normMeld(m.type, m.cards) }))]);
      setSelected([]); setMsg("Pose-tout trouvé ! Appuie sur le bouton doré."); return;
    }
    const sTri = staged.filter((m) => m.type === "tri").length;
    const sEsc = staged.filter((m) => m.type === "esc").length;
    const need = { tri: Math.max(0, contract.tri - sTri), esc: Math.max(0, contract.esc - sEsc) };
    if (need.tri === 0 && need.esc === 0) { setMsg("Ton contrat est déjà prêt — appuie sur le bouton doré !"); return; }
    const plan = planContract(visibleHand, need);
    if (!plan || plan.length === 0) { setMsg("Pas encore de quoi compléter le contrat (" + contract.label + ") — continue à piocher !"); return; }
    setStaged((st) => [...st, ...plan.map((m) => ({ ...m, cards: normMeld(m.type, m.cards) }))]);
    setSelected([]); setMsg("Combinaisons trouvées ! Vérifie puis pose.");
  }

  const stagedTri = staged.filter((m) => m.type === "tri").length;
  const stagedEsc = staged.filter((m) => m.type === "esc").length;
  const selCards = visibleHand.filter((c) => selected.includes(c.id));
  const selTriOk = selCards.length >= 3 && isTri(selCards);
  const selEscOk = selCards.length >= 3 && isEscalier(selCards);
  const canPose = contract && me && !me.posed && myTurn && g.phase === "play" && staged.length > 0 &&
    (contract.poseTout ? visibleHand.length === 0 : stagedTri >= contract.tri && stagedEsc >= contract.esc);

  function pose() {
    if (!canPose) return;
    vibrate([60]); // le son viendra de l'écho « fx » du serveur (sinon il est joué deux fois)
    act({ type: "pose", melds: staged.map((m) => ({ type: m.type, cardIds: m.cards.map((c) => c.id) })) });
  }
  function discardById(cardId) {
    if (!myTurn || g.phase !== "play") { setMsg("Tu pourras jeter pendant ton tour."); return; }
    act({ type: "discard", cardId });
  }
  function completeWith(meldId, cardId) {
    if (!myTurn || g.phase !== "play") { setMsg("Attends ton tour pour compléter."); return; }
    act({ type: "complete", meldId, cardId });
  }

  // ---------- Glisser-déposer ----------
  function insertionIndexAt(x, y) {
    const cont = handRef.current;
    if (!cont) return null;
    const els = [...cont.querySelectorAll("[data-cid]")];
    let target = els.length;
    for (let i = 0; i < els.length; i++) {
      const r = els[i].getBoundingClientRect();
      const inRow = y >= r.top - 4 && y <= r.bottom + 4;
      if ((inRow && x < r.left + r.width / 2) || y < r.top - 4) { target = i; break; }
    }
    return target;
  }
  function visibleIndexToOrderIndex(vi) {
    // convertit une position dans la main affichée en position dans l'ordre local complet
    if (vi == null) return null;
    if (vi >= visibleHand.length) return orderRef.current.length;
    const targetId = visibleHand[vi].id;
    return orderRef.current.indexOf(targetId);
  }
  function onCardPointerDown(e, c) {
    dragInfo.current = { id: c.id, card: c, startX: e.clientX, startY: e.clientY, dragging: false };
    // Capture sur le conteneur de la main (élément stable) : sur iOS, capturer la carte
    // elle-même tue le geste (pointercancel) dès que le réordonnancement la déplace dans le DOM.
    try { handRef.current.setPointerCapture(e.pointerId); } catch (_) {}
  }
  function onCardPointerMove(e) {
    const d = dragInfo.current;
    if (!d) return;
    if (!d.dragging && Math.hypot(e.clientX - d.startX, e.clientY - d.startY) > 15) { d.dragging = true; lastTargetRef.current = -1; }
    if (d.dragging) {
      const dr = discardRef.current && discardRef.current.getBoundingClientRect();
      const hrG = handRef.current && handRef.current.getBoundingClientRect();
      const chD = UI_PREFS.big ? 72 : 58;
      const gT = e.clientY - (UI_PREFS.big ? 76 : 62), gL = e.clientX - 20;
      const gR = { left: gL, right: gL + (UI_PREFS.big ? 50 : 40), top: gT, bottom: gT + chD };
      // Le fantôme doit être DAVANTAGE sur la défausse que sur la main : avec une main sur
      // 2 lignes, ranger une carte vers la ligne du haut ne doit pas s'allumer comme un jet.
      const aD = aireCommune(gR, dr && { left: dr.left - 14, right: dr.right + 14, top: dr.top - 14, bottom: dr.bottom + 14 });
      // Main sur plusieurs lignes + doigt dans la main = rangement, jamais un jet
      const multiL = hrG && hrG.height > (UI_PREFS.big ? 72 : 58) * 1.6;
      const doigtDansMain = hrG && e.clientY >= hrG.top && e.clientX >= hrG.left && e.clientX <= hrG.right;
      const overD = aD > 0 && aD >= aireCommune(gR, hrG) && !(multiL && doigtDansMain);
      if (overD) overStickyRef.current = Date.now();
      setDrag({ id: d.id, card: d.card, x: e.clientX, y: e.clientY, over: overD ? "discard" : null });
      const hr = handRef.current && handRef.current.getBoundingClientRect();
      if (!(hr && e.clientY >= hr.top - 10 && e.clientY <= hr.bottom + 10)) return;
      // Anti-oscillation : on attend que le doigt ait bougé un peu depuis le dernier reclassement
      if (d.lastRX != null && Math.hypot(e.clientX - d.lastRX, e.clientY - d.lastRY) < 14) return;
      const vi = insertionIndexAt(e.clientX, e.clientY);
      if (vi != null && vi !== lastTargetRef.current) {
        lastTargetRef.current = vi;
        d.lastRX = e.clientX; d.lastRY = e.clientY;
        const order = orderRef.current.filter((id) => id !== d.id);
        const oi = (() => {
          if (vi >= visibleHand.filter((c) => c.id !== d.id).length) return order.length;
          const vis = visibleHand.filter((c) => c.id !== d.id);
          return order.indexOf(vis[vi].id);
        })();
        order.splice(Math.max(0, oi), 0, d.id);
        orderRef.current = order;
        setTick((x) => x + 1);
      }
    }
  }
  function onCardPointerUp(e) {
    const d = dragInfo.current;
    dragInfo.current = null;
    if (!d) return;
    if (d.dragging) {
      setDrag(null); lastTargetRef.current = -1;
      handleDrop(e.clientX, e.clientY, d.card);
      return;
    }
    tapCard(d.id);
  }
  function discardDropAt(x, y) {
    const cont = handRef.current;
    const r = cont && cont.getBoundingClientRect();
    const overHand = r && y >= r.top - 24 && y <= r.bottom + 24 && x >= r.left && x <= r.right;
    if (!overHand) return;
    if (g && g.discardTop && g.discardTop.joker) { setMsg("Impossible de récupérer un joker jeté — il est perdu !"); return; }
    const vi = insertionIndexAt(x, y);
    pendingInsertRef.current = visibleIndexToOrderIndex(vi);
    if (g.phase === "buyWindow") {
      if (g.buyNextIdx === youIdx) socket.emit("claimNext");
      else act({ type: "buy" });
    }
    else if (myTurn && g.phase === "draw") act({ type: "draw", source: "discard" });
    else { pendingInsertRef.current = null; setMsg("Tu ne peux pas prendre cette carte maintenant."); }
  }

  function handleDrop(x, y, card) {
    const ch = UI_PREFS.big ? 72 : 58; // hauteur de la carte fantôme (option « grandes cartes »)
    const cw = UI_PREFS.big ? 50 : 40;
    // Rectangle réel de la carte fantôme, qui flotte AU-DESSUS du doigt (cf. style du glissement)
    const gT = y - (UI_PREFS.big ? 76 : 62), gL = x - 20;
    const gRect = { left: gL, right: gL + cw, top: gT, bottom: gT + ch };
    const overlaps = (r, m) => Boolean(r) && gRect.left < r.right + m && gRect.right > r.left - m && gRect.top < r.bottom + m && gRect.bottom > r.top - m;
    // 1) AJOUT à un groupe « Prêt » : on se base sur la position de la CARTE (pas du doigt, souvent resté
    //    dans la main), et seulement si la carte complète vraiment le groupe — sinon c'est un reclassement.
    const stagedEls = document.querySelectorAll("[data-sid]");
    for (const el of stagedEls) {
      if (!overlaps(el.getBoundingClientRect(), 8)) continue;
      const gi = Number(el.getAttribute("data-sid"));
      const grp = staged[gi];
      const okG = grp && (grp.type === "tri" ? isTri([...grp.cards, card]) : isEscalier([...grp.cards, card]));
      if (grp && !(me && me.posed) && okG) {
        addToStagedCards(gi, [card.id]);
        return;
      }
    }
    const pts = [[x, y], [x, y - ch / 2 - 5], [x, y - ch]]; // le doigt, le centre et le haut de la carte fantôme
    const inRect = (r, m) => Boolean(r) && pts.some(([px, py]) => px >= r.left - m && px <= r.right + m && py >= r.top - m && py <= r.bottom + m);
    // 2) Le doigt DANS la zone de la main = simple reclassement… SAUF si la carte fantôme
    // (dessinée au-dessus du doigt) est posée sur la défausse : c'est un jet. Sans cette
    // exception, jeter demandait de « viser plus loin » que la défausse (doigt encore dans la main).
    const hr0 = handRef.current && handRef.current.getBoundingClientRect();
    const drPre = discardRef.current && discardRef.current.getBoundingClientRect();
    const aDrop = aireCommune(gRect, drPre && { left: drPre.left - 10, right: drPre.right + 10, top: drPre.top - 10, bottom: drPre.bottom + 10 });
    // Main sur plusieurs lignes : le doigt dans la main range, il ne jette jamais
    const multiL = hr0 && hr0.height > (UI_PREFS.big ? 72 : 58) * 1.6;
    const surDefausse = !multiL && ((aDrop > 0 && aDrop >= aireCommune(gRect, hr0)) || Date.now() - overStickyRef.current < 250);
    if (hr0 && y >= hr0.top && x >= hr0.left && x <= hr0.right && !surDefausse) { overStickyRef.current = 0; return; }
    // Combinaisons de la table : priorité au point le plus proche du doigt, et si plusieurs sont
    // touchées (rangées voisines), on choisit celle que la carte peut réellement compléter
    const meldEls = [...document.querySelectorAll("[data-mid]")];
    const hits = [];
    for (const [px, py] of pts) {
      for (const el of meldEls) {
        const r = el.getBoundingClientRect();
        if (px >= r.left - 14 && px <= r.right + 14 && py >= r.top - 14 && py <= r.bottom + 14) {
          const mid = Number(el.getAttribute("data-mid"));
          if (!hits.includes(mid)) hits.push(mid);
        }
      }
    }
    if (hits.length > 0) {
      if (me && me.posed) {
        const canUse = (m) => m && ((m.type === "tri" ? isTri([...m.cards, card]) : isEscalier([...m.cards, card])) ||
          (m.type === "esc" && !card.joker && m.cards.some((c, i) => c.joker && isOrderedEscalier(m.cards.map((x, j) => (j === i ? card : x))))));
        const fit = hits.find((mid) => canUse((g.melds || []).find((mm) => mm.id === mid)));
        completeWith(fit != null ? fit : hits[0], card.id);
      }
      else setMsg("Pose d'abord ton contrat avant de compléter.");
      return;
    }
    // 2) Ensuite seulement, la défausse
    const dr = discardRef.current && discardRef.current.getBoundingClientRect();
    const sticky = Date.now() - overStickyRef.current < 250; // la défausse vient de grossir : le jet compte
    overStickyRef.current = 0;
    if (inRect(dr, 28) || sticky) {
      if (myTurn && g.phase === "play") {
        setPendingDiscard(card.id);
        setMsg("");
      }
      else if (myTurn && g.phase === "draw") setMsg("Pioche d'abord, tu jetteras ensuite.");
      else setMsg("Tu pourras jeter pendant ton tour.");
      return;
    }
  }

  handleDropRef.current = handleDrop;
  discardDropRef.current = discardDropAt;
  function onDiscardPointerDown(e) {
    const top = g && g.discardTop;
    if (!top || g.roundOver) return;
    discardDragInfo.current = { card: top, startX: e.clientX, startY: e.clientY, dragging: false };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
  }
  function onDiscardPointerMove(e) {
    const d = discardDragInfo.current;
    if (!d) return;
    if (!d.dragging && Math.hypot(e.clientX - d.startX, e.clientY - d.startY) > 8) d.dragging = true;
    if (d.dragging) setDrag({ id: "discard-top", card: d.card, x: e.clientX, y: e.clientY, fromDiscard: true });
  }
  function onDiscardPointerUp(e) {
    const d = discardDragInfo.current;
    discardDragInfo.current = null;

    // Sécurité : confirmer le jet en attente
    if (pendingDiscard) {
      discardById(pendingDiscard);
      setPendingDiscard(null);
      setMsg("Carte jetée ✓");
      return;
    }

    if (d && d.dragging) {
      setDrag(null);
      const cont = handRef.current;
      const r = cont && cont.getBoundingClientRect();
      const overHand = r && e.clientY >= r.top - 24 && e.clientY <= r.bottom + 24 && e.clientX >= r.left && e.clientX <= r.right;
      discardDropAt(e.clientX, e.clientY);
      return;
    }
    if (g && g.discardTop && g.discardTop.joker) { setMsg("Impossible de récupérer un joker jeté — il est perdu !"); return; }
    if (g && g.phase === "buyWindow") {
      if (g.buyNextIdx === youIdx) socket.emit("claimNext");
      else act({ type: "buy" });
      return;
    }
    if (myTurn && g.phase === "draw") act({ type: "draw", source: "discard" });
    else if (g && !g.roundOver) setMsg("L'achat se fait dans la fenêtre qui suit chaque défausse.");
  }

  const secLeft = (ts) => (ts ? Math.max(0, Math.ceil((ts - srvNow()) / 1000)) : null);
  const bgStyle = { background: "radial-gradient(ellipse at 50% -10%, #1a6b42 0%, #14532d 45%, #052e16 100%)" };

  // ---------- Écrans ----------
  if (!srv) {
    const joinReady = joinCode.trim().length >= 5;

    // Première visite (et pas d'arrivée par lien d'invitation) : on présente le compte UNE fois
    if (!compteActif && !accueilChoisi && !arriveeParLien) {
      return (
        <div className="min-h-screen flex flex-col items-center justify-center gap-5 p-6" style={bgStyle}>
          {STYLE}
          <div className="text-center" style={{ textShadow: "0 3px 10px rgba(0,0,0,.6)" }}>
            <h1 className="text-5xl text-amber-300" style={{ fontFamily: "Georgia, serif" }}>Ramy Gasy</h1>
            <p className="text-emerald-200 text-sm mt-1">Le rami à contrats de Madagascar</p>
          </div>
          <div className="panel rounded-2xl p-5 w-full max-w-xs flex flex-col gap-3 text-emerald-100" style={{ borderColor: "#f59e0b66" }}>
            <p className="text-sm text-center leading-relaxed">Bienvenue ! 🎴</p>
            <p className="text-[12px] text-emerald-300 text-center leading-relaxed">
              Avec un <b className="text-amber-300">compte gratuit</b> (pseudo + code à 6 chiffres, sans email) :
              tes stats et succès te suivent partout, tu reprends tes parties sur n'importe quel appareil,
              et tu entres aux classements des défis.
            </p>
            <button onClick={() => { store.set("rami-accueil-vu", "1"); setAccueilChoisi(true); setCptErr(""); setCptNouveau(null); setCptMode("choix"); setCptOpen(true); }}
              className="btn-gold font-bold py-3 rounded-xl text-base">👤 Créer mon compte / me connecter</button>
            <button onClick={() => { store.set("rami-accueil-vu", "1"); setAccueilChoisi(true); }}
              className="btn-dark font-bold py-2.5 rounded-xl text-sm">🎮 Jouer en invité</button>
            <p className="text-[10px] text-emerald-400 text-center">Tu pourras créer un compte à tout moment depuis la pastille 👤 en haut à droite.</p>
          </div>
        </div>
      );
    }
    // Premier lancement : « Apprendre » passe en tête. Un joueur est considéré « ancien » dès
    // qu'un indice le montre (partie lancée, compte, pseudo mémorisé, sauvegarde) — ainsi
    // l'ordre reste cohérent entre le web et l'app, même sur un appareil pas resservi depuis longtemps.
    const dejaJoue = Boolean(store.get("rami-played") || compteActif || store.get("rami-name") ||
      store.get("ramimp-name") || store.get("rami-save") || store.get("rami-level"));
    const soloSave = Boolean(store.get("rami-save"));   // une partie solo attend d'être reprise
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-4 p-6 pt-16" style={bgStyle}>
        {STYLE}
        {(showMp || showLocal) && (
          <button onClick={() => { setShowMp(false); if (showLocal) closeLocal(); }} className="fixed top-3 left-3 z-40 btn-gold rounded-xl px-3 py-1.5 text-xs font-bold">← Accueil</button>
        )}
        <div className="text-center" style={{ textShadow: "0 3px 10px rgba(0,0,0,.6)" }}>
          <h1 className="text-5xl text-amber-300" style={{ fontFamily: "Georgia, serif" }}>Ramy Gasy</h1>
          <p className="text-emerald-200 text-sm mt-1">Le rami à contrats de Madagascar</p>
        </div>
        {connErr && <p className="text-xs text-red-300">{connErr}</p>}

        {/* Cartes de jeu — la reprise d'abord, puis un ordre adapté au profil du visiteur */}
        {!showMp && !showLocal && (() => {
          const carteSolo = (
            <a href={soloSave ? "/solo.html?reprendre=1" : "/solo.html"}
              className="panel rounded-2xl p-4 w-full max-w-xs flex items-center gap-3 text-emerald-100 no-underline"
              style={soloSave ? { borderColor: "#34d39988" } : {}}>
              <span className="text-3xl">🎮</span>
              <span className="flex-1">
                <span className="block font-bold text-base">Jouer en solo</span>
                {soloSave ? (
                  <span className="block text-xs font-bold text-emerald-300">▶ Ta partie en cours t'attend — reprendre</span>
                ) : (
                  <span className="block text-xs text-emerald-300">Contre l'ordinateur, tout de suite, sans compte</span>
                )}
              </span>
              <span className="text-amber-300 text-xl font-bold">→</span>
            </a>
          );
          const carteTuto = (
            <a href="/solo.html?tuto=1" className="panel rounded-2xl p-4 w-full max-w-xs flex items-center gap-3 no-underline"
              style={{ borderColor: "#67e8f966" }}>
              <span className="text-3xl">🎓</span>
              <span className="flex-1">
                <span className="block font-bold text-base text-cyan-200">Apprendre à jouer</span>
                <span className="block text-xs text-emerald-300">Partie guidée avec Maki 🐒 — 5 minutes</span>
              </span>
              <span className="text-amber-300 text-xl font-bold">→</span>
            </a>
          );
          return (<>
            {salonEnCours && compteActif && (
              <button onClick={reprendreSalonCompte}
                className="panel rounded-2xl p-4 w-full max-w-xs flex items-center gap-3 text-emerald-100 text-left" style={{ borderColor: "#34d39988" }}>
                <span className="text-3xl">🌐</span>
                <span className="flex-1">
                  <span className="block font-bold text-base text-emerald-200">Reprendre ta partie multijoueur</span>
                  <span className="block text-xs text-emerald-300">
                    Salon {salonEnCours.salon} · {salonEnCours.joueurs} joueur{salonEnCours.joueurs > 1 ? "s" : ""}{salonEnCours.enPartie ? " · en cours" : " · en attente"}
                  </span>
                </span>
                <span className="text-amber-300 text-xl font-bold">→</span>
              </button>
            )}
            {dejaJoue ? carteSolo : carteTuto}
