<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Modération — Ramy Gasy</title>
<link rel="icon" href="/favicon.png" />
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #052e16; color: #d1fae5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: 16px; max-width: 900px; margin: 0 auto; }
  h1 { color: #fcd34d; font-size: 20px; margin: 8px 0 4px; }
  .sub { font-size: 12px; opacity: .7; margin-bottom: 16px; }
  .carte { background: #064e3b88; border: 1px solid #10b98155; border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .carte.traite { opacity: .45; }
  .ligne { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .pseudo { color: #fcd34d; font-weight: bold; font-size: 15px; }
  .motif { background: #b4530933; color: #fdba74; border-radius: 8px; padding: 2px 8px; font-size: 11px; }
  .meta { font-size: 11px; opacity: .65; }
  .details { font-size: 13px; margin: 8px 0; padding: 8px; background: #02231088; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  button { background: #065f46; color: #d1fae5; border: 1px solid #10b98166; border-radius: 10px;
           padding: 7px 12px; font-size: 12px; cursor: pointer; font-weight: 600; }
  button:hover { background: #047857; }
  button.rouge { background: #7f1d1d; border-color: #ef444466; }
  button.rouge:hover { background: #991b1b; }
  button:disabled { opacity: .4; cursor: default; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: #7f1d1d; color: #fecaca; }
  input { background: #022310; border: 1px solid #10b98166; border-radius: 10px; padding: 9px;
          color: #d1fae5; font-size: 14px; width: 100%; box-sizing: border-box; }
  .vide { text-align: center; opacity: .6; padding: 40px 0; font-size: 14px; }
  .msg { background: #065f4666; border-radius: 10px; padding: 10px; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>🛡️ Modération</h1>
<div class="sub">Signalements des joueurs — Ramy Gasy</div>
<div id="zoneCle" style="display:none">
  <p style="font-size:13px">Entre la clé d'administration (variable <code>STATS_KEY</code> sur Render) :</p>
  <input id="cle" type="password" placeholder="Clé d'administration" />
  <button style="margin-top:8px" onclick="entrer()">Entrer</button>
  <p id="erreurCle" style="color:#fca5a5;font-size:12px"></p>
</div>
<div id="msg"></div>
<div id="liste"></div>

<script src="/config.js"></script>
<script>
var API = (window.RAMI_CONFIG && window.RAMI_CONFIG.server) || "";
var cle = new URLSearchParams(location.search).get("cle") || sessionStorage.getItem("mod-cle") || "";

function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function entrer() {
  cle = document.getElementById("cle").value.trim();
  sessionStorage.setItem("mod-cle", cle);
  charger();
}
function flash(t) {
  document.getElementById("msg").innerHTML = '<div class="msg">' + esc(t) + "</div>";
  setTimeout(function () { document.getElementById("msg").innerHTML = ""; }, 4000);
}
function charger() {
  if (!cle) { document.getElementById("zoneCle").style.display = "block"; return; }
  fetch(API + "/moderation/liste?cle=" + encodeURIComponent(cle))
    .then(function (r) {
      if (r.status === 403) throw new Error("Clé incorrecte.");
      return r.json();
    })
    .then(function (d) {
      document.getElementById("zoneCle").style.display = "none";
      afficher(d.signalements || []);
    })
    .catch(function (e) {
      document.getElementById("zoneCle").style.display = "block";
      document.getElementById("erreurCle").textContent = e.message || "Serveur injoignable.";
    });
}
function afficher(list) {
  var el = document.getElementById("liste");
  if (!list.length) { el.innerHTML = '<div class="vide">Aucun signalement — tout va bien 🌿</div>'; return; }
  el.innerHTML = list.map(function (s) {
    var date = new Date(s.at).toLocaleString("fr-FR");
    var act = "";
    if (s.existe) {
      act += '<button onclick="agir(\'renommer\',\'' + s.cible + '\')">✏️ Renommer d\'office</button>';
      if (s.aPhoto) act += '<button onclick="agir(\'photo\',\'' + s.cible + '\')">🖼️ Supprimer la photo</button>';
      act += s.banni
        ? '<button onclick="agir(\'debannir\',\'' + s.cible + '\')">↩️ Réactiver</button>'
        : '<button class="rouge" onclick="agir(\'bannir\',\'' + s.cible + '\')">🚫 Bannir</button>';
    }
    if (!s.traite) act += '<button onclick="traiter(\'' + s.id + '\')">✓ Marquer traité</button>';
    return '<div class="carte' + (s.traite ? " traite" : "") + '">' +
      '<div class="ligne"><span class="pseudo">' + esc(s.pseudoCible) + "</span>" +
        (s.banni ? ' <span class="badge">banni</span>' : "") +
        (s.existe ? "" : ' <span class="meta">(compte supprimé)</span>') +
        '<span class="motif">' + esc(s.motifLisible) + "</span></div>" +
      '<div class="meta">signalé par ' + esc(s.par) + " · " + esc(date) + "</div>" +
      (s.details ? '<div class="details">' + esc(s.details) + "</div>" : "") +
      '<div class="actions">' + act + "</div></div>";
  }).join("");
}
function agir(action, code) {
  var libelle = { bannir: "bannir ce compte", debannir: "réactiver ce compte",
                  renommer: "renommer ce joueur d'office", photo: "supprimer cette photo" }[action];
  if (!confirm("Confirmer : " + libelle + " ?")) return;
  fetch(API + "/moderation/action", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cle: cle, action: action, code: code }),
  }).then(function (r) { return r.json(); })
    .then(function (d) { flash(d.message || d.erreur || "Fait."); charger(); })
    .catch(function () { flash("Serveur injoignable."); });
}
function traiter(id) {
  fetch(API + "/moderation/action", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cle: cle, action: "traiter", id: id }),
  }).then(function () { charger(); }).catch(function () {});
}
charger();
setInterval(function () { if (cle) charger(); }, 60000);
</script>
</body>
</html>
